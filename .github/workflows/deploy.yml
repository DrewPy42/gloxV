name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose -p app1 up -d --build --remove-orphans
      - name: Clean up old images
        run: docker image prune -f
