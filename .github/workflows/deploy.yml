name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux, ARM64]
    steps:
    - uses: actions/checkout@v5
    - name: Load environment
      run: cp /srv/gloxv/.env .env
    - name: Stop and remove old containers
      # No -v: the mysql-data and logos volumes must survive.
      run: docker compose -p gloxv down --remove-orphans
    - name: Build and start
      run: docker compose -p gloxv up -d --build --remove-orphans
    - name: Clean up old images
      run: docker image prune -f
