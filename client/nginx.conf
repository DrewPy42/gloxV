server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # API: same origin as the app, so the browser needs no CORS.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public assets (covers, logos, characters, ...) come from the persistent host
  # folder mounted at /srv/public. Files bundled into the build (e.g. the
  # placeholder images) are the fallback.
  location /images/ {
    root /srv/public;
    try_files $uri @bundled_images;
    expires 7d;
  }
  location @bundled_images {
    root /usr/share/nginx/html;
  }

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for vue-router history mode.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
