server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10m;

  # API: same origin as the app, so the browser needs no CORS.
  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Publisher logos: bundled ones come from the build, uploaded ones from the
  # shared volume the server writes to.
  location ~ ^/images/logos/(.+)$ {
    try_files /images/logos/$1 @uploaded_logos;
  }
  location @uploaded_logos {
    rewrite ^/images/logos/(.*)$ /$1 break;
    root /srv/uploaded-logos;
  }

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for vue-router history mode.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
