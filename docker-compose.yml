# Production stack (used by the deploy workflow).
# For local development add the dev overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  client:
    build:
      context: ./client
      target: production
    ports:
      - "5200:80"
    volumes:
      # Host folder holding the site's public assets (covers, logos, ...). It lives
      # outside the repo and image, so rebuilds and redeploys never touch it.
      - ${PUBLIC_DIR:-/srv/gloxv/public}:/srv/public:ro
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - app-network
  server:
    build:
      context: ./server
      target: production
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      LOGO_DIR: /logos
    volumes:
      # Uploaded publisher logos are written into the same persistent public folder.
      - ${PUBLIC_DIR:-/srv/gloxv/public}/images/logos:/logos
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
  mysql:
    image: mysql:26.10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql-data:

networks:
  app-network:
